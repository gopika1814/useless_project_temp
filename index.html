<!DOCTYPE html>
<html>
<head>
    <title>Excuse Generator Pro</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
  
    <div class="container">

        <h1>😂 Excuse Generator Pro</h1>

        <p>Need an excuse? We have absolutely terrible ones!</p>

        <select id="category">
            <option value="college">🎓 College Excuses</option>
            <option value="late">📝 Late Submission</option>
            <option value="skip">🏫 Skipping Class</option>
            <option value="random">🎲 Random Excuse</option>
        </select>
         <button onclick="generateExcuse()">
            Generate Excuse 😂
        </button>

        <div id="excuse">
            Your excuse will appear here...
        </div>

    </div>

    <script src="script.js"></script>

</body>
</html>
